openapi: 3.0.0
info:
  title: Order API
  version: 1.0.0
  description: API for managing orders in the FNB QRIS system.
path:
  /orders:
    get:
      summary: Retrieve a list of orders
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    item_name:
                      type: string
                      example: "Pizza"
                    quantity:
                      type: integer
                      example: 2
                    price:
                      type: number
                      format: float
                      example: 19.99